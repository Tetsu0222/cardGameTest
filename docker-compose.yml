# ローカルに .NET SDK を入れずに開発するための設定。
#   docker compose run --rm dotnet dotnet build
#   docker compose run --rm dotnet dotnet test
#   docker compose up web      -> http://localhost:5000
services:
  dotnet:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - .:/src
      - nuget:/root/.nuget/packages

  web:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - .:/src
      - nuget:/root/.nuget/packages
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ASPNETCORE_ENVIRONMENT: Development
      # Windows からのボリュームマウントではファイル変更通知が届かないため、ポーリングで検知する
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    command: dotnet watch run --project src/CardGame.Web --no-launch-profile --non-interactive

volumes:
  nuget:
